[package]
name = "ash-jsonschema-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Giorgos Ntemiris <gntem@users.noreply.github.com>"]
description = "A typed builder for JSON Schema 2020-12 — chain the keywords, call .build(), get a schema."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ashforge-rs/ash-jsonschema"
documentation = "https://docs.rs/ash-jsonschema-builder"
keywords = ["jsonschema", "json-schema", "builder", "schema", "validation"]
categories = ["data-structures", "encoding", "rust-patterns"]

# docs.rs builds with every feature on, so the gated items appear. Rustdoc
# labels each with the feature it needs on its own — `doc_auto_cfg` is no longer
# a feature to opt into.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["validation"]
# Checking instances against schemas: `Validator`, `Outcome`, and the
# `validator!` macro. The rest of the crate builds, reads, resolves, compares,
# and bundles schemas as documents, and needs none of it — turn this off with
# `default-features = false` for a build that only writes schemas.
#
# It gates no dependency — `regex-lite` is needed either way, since the
# meta-schema check `.build()` runs asserts two patterns of its own. What it
# gates is the evaluator: roughly a fifth of the crate's source, and about half
# a second of a clean build.
validation = []
# The IANA root zone, vendored so `validator::tld` can answer whether a
# top-level domain actually exists. About 9 KB of data and 1,438 entries.
#
# Off by default, and deliberately: the list is a *snapshot*, so a build from
# last year rejects a TLD delegated this year. `is_tld_shaped` needs no list and
# never goes stale, which is the safer default for most schemas.
iana-tlds = ["validation"]

[dependencies]
# The schema tree is a plain `Serialize` document; serde's derive writes the
# keyword renames (`$id`, `multipleOf`, …) and drops every unset keyword.
serde = { version = "1", features = ["derive"] }
# `serde_json::Value` is the natural carrier for the schema keywords that take
# an arbitrary JSON instance (`const`, `default`, `enum`, `examples`), and it is
# what a built schema renders into — and what the meta-schema is checked as.
serde_json = "1"
# The meta-schema asserts two `pattern`s (the `$anchor` grammar and the
# no-fragment rule for `$id`), so checking a built schema needs a real regex
# engine. `regex-lite` rather than `regex`: the patterns are fixed, tiny, and
# compiled once at load, so none of the larger crate's throughput work would
# ever pay for its dependencies or compile time.
regex-lite = "0.1"

# The validator's own example and integration tests exist only when the
# evaluator does. Declaring that here keeps the files themselves free of
# `#![cfg]` prologues.
[[example]]
name = "validate"
required-features = ["validation"]

[[test]]
name = "validator"
required-features = ["validation"]

[[test]]
name = "formats"
required-features = ["validation"]

[[test]]
name = "output"
required-features = ["validation"]

[[example]]
name = "formats"
required-features = ["validation"]

[[example]]
name = "output"
required-features = ["validation"]
